@if (project(); as p) {
  <app-gallery-cover
    data-testid="client-project-cover"
    [images]="coverImages()"
    [title]="p.title"
    [customerName]="p.customerName"
    [meta]="
      (p.date | localDate: 'd MMMM y') +
      ' · ' +
      ('client.project.meta' | translate: { count: p.photos.length, size: totalSize() })
    "
    [downloadUrl]="p.photos.length ? zipUrl : ''"
    (explore)="showPhotos()"
  />

  <section #photos data-testid="client-project-project-photos" app-container class="project-photos">
    @for (photo of p.photos; track photo.id; let i = $index) {
      <figure class="project-photos__item" appReveal="fade" [revealDelay]="(i % 4) * 80">
        <button
          data-testid="client-project-open-index"
          type="button"
          class="project-photos__open"
          (click)="openIndex.set(i)"
          [attr.aria-label]="('common.open' | translate) + ' ' + photo.name"
        >
          <img
            [src]="photo.thumbUrl"
            [alt]="photo.name"
            class="project-photos__image"
            loading="lazy"
            decoding="async"
          />
        </button>
        <a
          data-testid="client-project-download-photo"
          [href]="photo.originalUrl + '?download=true'"
          [attr.download]="photo.name"
          class="project-photos__download"
          [attr.aria-label]="('common.download' | translate) + ' ' + photo.name"
        >
          <app-icon name="download" [size]="16" />
        </a>
      </figure>
    }
  </section>

  <app-lightbox [items]="items()" [(index)]="openIndex" [allowDownload]="true" />
} @else if (loaded()) {
  <section data-testid="client-project-project-empty" app-container class="project-empty">
    <app-icon name="camera" [size]="36" class="project-empty__icon" />
    <h1 app-title size="md">{{ 'client.project.emptyTitle' | translate }}</h1>
    <p app-text>{{ 'client.project.emptyText' | translate }}</p>
  </section>
}
