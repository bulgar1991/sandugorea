<div class="sign-in">
  <div class="sign-in__visual">
    <img [src]="image" alt="" class="sign-in__image" decoding="async" />
    <div class="sign-in__shade"></div>
    <p class="sign-in__quote">{{ 'client.login.quote' | translate }}</p>
  </div>

  <div class="sign-in__side">
    <div class="sign-in__top">
      <a routerLink="/" class="sign-in__back">
        <app-icon name="arrow-left" [size]="14" />
        {{ brand.name }}
      </a>
      <app-language-switcher />
    </div>

    <div class="sign-in__box">
      <span class="sign-in__lock sign-in__step" style="--i: 0">
        <app-icon name="lock" />
      </span>
      <h1 class="title title--lg sign-in__title sign-in__step" style="--i: 1">
        {{ 'client.login.title' | translate }}
      </h1>
      <p class="text sign-in__text sign-in__step" style="--i: 2">
        {{ 'client.login.text' | translate }}
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="sign-in__form" novalidate>
        <label class="field sign-in__step" style="--i: 3">
          <span class="field__label">{{ 'common.username' | translate }}</span>
          <input
            class="field__control"
            formControlName="username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
          />
        </label>

        <label class="field sign-in__step" style="--i: 4">
          <span class="field__label">{{ 'common.password' | translate }}</span>
          <div class="field__wrap">
            <input
              class="field__control"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="field__toggle"
              (click)="showPassword.update((v) => !v)"
              [attr.aria-label]="
                (showPassword() ? 'common.hidePassword' : 'common.showPassword') | translate
              "
            >
              <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
            </button>
          </div>
        </label>

        @if (error()) {
          <p class="alert" role="alert">{{ error()!.key | translate: error()!.params }}</p>
        }

        <button
          type="submit"
          class="btn btn--primary btn--block sign-in__step"
          style="--i: 5"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="spinner"></span>
            {{ 'client.login.loading' | translate }}
          } @else {
            {{ 'client.login.submit' | translate }}
            <app-icon name="arrow-right" [size]="16" />
          }
        </button>
      </form>

      <p class="sign-in__help sign-in__step" style="--i: 6">
        {{ 'client.login.lost' | translate }}
        <a routerLink="/" fragment="booking" class="link">{{
          'client.login.contact' | translate
        }}</a
        >.
      </p>
    </div>
  </div>
</div>
