<main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-6 px-4">
  <h1 class="text-4xl font-bold">Sandugorea</h1>
  <p class="text-ink-muted">Angular + .NET 10</p>

  <div class="card">
    @switch (health()) {
      @case (undefined) {
        <span>Checking API…</span>
      }
      @case (null) {
        <span class="text-danger">API unreachable</span>
      }
      @default {
        <span class="text-success">API: {{ health()?.status }}</span>
      }
    }
  </div>
</main>
