<app-page-hero
  eyebrow="Contact"
  title="Let's create together"
  subtitle="Tell me a little about you and what you have in mind. I reply to every message within two days."
/>

<section class="wrapper contact">
  <aside class="contact__info">
    @for (item of contactItems; track item.label; let i = $index) {
      <div class="contact__item" appReveal [revealDelay]="i * 100">
        <span class="contact__icon">
          <app-icon [name]="item.icon" [size]="18" />
        </span>
        <div>
          <p class="contact__label">{{ item.label }}</p>
          @if (item.href) {
            <a
              [href]="item.href"
              target="_blank"
              rel="noopener"
              class="link--underline contact__value contact__value--link"
              >{{ item.value }}</a
            >
          } @else {
            <p class="contact__value">{{ item.value }}</p>
          }
        </div>
      </div>
    }
  </aside>

  <div class="contact__main" appReveal [revealDelay]="150">
    @if (state() === 'sent') {
      <div class="card card--padded contact__success">
        <span class="contact__check"><app-icon name="check" /></span>
        <h2 class="title title--md">Thank you.</h2>
        <p class="text">Your message is on its way. I'll be in touch very soon.</p>
        <button type="button" class="btn btn--ghost" (click)="state.set('idle')">
          Send another
        </button>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="contact__form" novalidate>
        <label class="field">
          <span class="field__label">Your name *</span>
          <input class="field__control" formControlName="name" autocomplete="name" />
          @if (invalid('name')) {
            <small class="field__error">Please enter your name.</small>
          }
        </label>
        <label class="field">
          <span class="field__label">Email *</span>
          <input class="field__control" type="email" formControlName="email" autocomplete="email" />
          @if (invalid('email')) {
            <small class="field__error">Please enter a valid email.</small>
          }
        </label>
        <label class="field">
          <span class="field__label">Session type</span>
          <select class="field__control contact__select" formControlName="type">
            @for (t of sessionTypes; track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
        </label>
        <label class="field">
          <span class="field__label">Preferred date</span>
          <input class="field__control field__control--date" type="date" formControlName="date" />
        </label>
        <label class="field contact__wide">
          <span class="field__label">Your message *</span>
          <textarea class="field__control contact__message" formControlName="message"></textarea>
          @if (invalid('message')) {
            <small class="field__error">Tell me a little more (at least 10 characters).</small>
          }
        </label>
        <div class="contact__wide">
          <button type="submit" class="btn btn--primary" [disabled]="state() === 'sending'">
            @if (state() === 'sending') {
              Sending…
            } @else {
              Send message
              <app-icon name="send" [size]="16" />
            }
          </button>
        </div>
      </form>
    }
  </div>
</section>
