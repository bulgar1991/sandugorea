<div class="admin">
  <aside class="admin__sidebar" [class.admin__sidebar--open]="navOpen()">
    <div class="admin__brand">
      <span class="admin__brand-mark"><app-icon name="camera" [size]="18" /></span>
      <div>
        <p class="admin__brand-name">{{ brand.owner }}</p>
        <p class="admin__brand-tag">Admin</p>
      </div>
    </div>

    <nav class="admin__nav" aria-label="Admin">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="admin__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="admin__link"
        >
          <app-icon [name]="item.icon" [size]="18" />
          {{ item.label | translate }}
        </a>
      }
    </nav>

    <div class="admin__account">
      <app-language-switcher class="admin__lang" [up]="true" />
      <div class="admin__timer" [class.admin__timer--warning]="expiringSoon()">
        <app-icon name="clock" [size]="14" />
        {{ 'admin.autoSignOut' | translate: { time: remaining() } }}
      </div>
      <div class="admin__user">
        <span app-avatar><app-icon name="user" [size]="16" /></span>
        <div class="admin__user-info">
          <p class="admin__user-name">{{ auth.session()?.displayName }}</p>
          <p class="admin__user-login">Admin</p>
        </div>
        <button
          type="button"
          class="admin__logout"
          (click)="auth.logout()"
          [attr.aria-label]="'common.signOut' | translate"
          [attr.title]="'common.signOut' | translate"
        >
          <app-icon name="logout" [size]="16" />
        </button>
      </div>
    </div>
  </aside>

  @if (navOpen()) {
    <div class="admin__overlay" (click)="navOpen.set(false)" aria-hidden="true"></div>
  }

  <header class="admin__topbar">
    <button
      type="button"
      class="admin__menu"
      (click)="navOpen.set(true)"
      [attr.aria-label]="'admin.nav.openMenu' | translate"
    >
      <app-icon name="menu" />
    </button>
    <span class="admin__topbar-title">{{ brand.owner }}</span>
    <span class="admin__timer" [class.admin__timer--warning]="expiringSoon()">{{
      remaining()
    }}</span>
  </header>

  <main class="admin__main">
    <router-outlet />
  </main>
</div>

<app-toasts />
