<app-page-hero
  eyebrow="Portfolio"
  title="A collection of moments"
  subtitle="Weddings, portraits, families and places - each photograph a small piece of someone's story."
/>

<section class="wrapper portfolio">
  <div class="portfolio__filters" role="tablist" aria-label="Categories">
    @for (f of filters; track f.id) {
      <button
        type="button"
        role="tab"
        class="portfolio__filter"
        [class.portfolio__filter--active]="active() === f.id"
        [attr.aria-selected]="active() === f.id"
        (click)="select(f.id)"
      >
        {{ f.label }}
      </button>
    }
  </div>

  <div class="portfolio__grid">
    @for (photo of photos(); track photo.id; let i = $index) {
      <figure class="photo" appReveal="up" [revealDelay]="(i % 3) * 100">
        <button
          type="button"
          class="photo__button"
          (click)="openIndex.set(i)"
          [attr.aria-label]="'Open ' + photo.title"
        >
          <img
            [src]="photo.thumb"
            [alt]="photo.title"
            class="photo__image"
            [class]="'photo__image--' + photo.orientation"
            loading="lazy"
            decoding="async"
          />
          <figcaption class="photo__caption">
            <span class="photo__title">{{ photo.title }}</span>
            <span class="photo__category">{{ photo.category }}</span>
          </figcaption>
        </button>
      </figure>
    }
  </div>
</section>

<app-lightbox [items]="lightboxItems()" [(index)]="openIndex" />
