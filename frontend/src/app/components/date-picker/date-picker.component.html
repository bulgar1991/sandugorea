<div class="date-picker">
  <div class="date-picker__head">
    <button
      data-testid="date-picker-prev"
      type="button"
      class="date-picker__nav"
      (click)="step(-1)"
      [disabled]="!canGoBack()"
      [attr.aria-label]="'common.previous' | translate"
    >
      <app-icon name="chevron-left" [size]="18" />
    </button>
    <p class="date-picker__month" aria-live="polite">{{ monthLabel() }}</p>
    <button
      data-testid="date-picker-next"
      type="button"
      class="date-picker__nav"
      (click)="step(1)"
      [attr.aria-label]="'common.next' | translate"
    >
      <app-icon name="chevron-right" [size]="18" />
    </button>
  </div>

  <div class="date-picker__weekdays" aria-hidden="true">
    @for (w of weekdays(); track $index) {
      <span>{{ w }}</span>
    }
  </div>

  <div class="date-picker__grid" role="grid">
    @for (d of days(); track d.iso; let i = $index) {
      <button
        data-testid="date-picker-day"
        type="button"
        class="date-picker__day"
        [class.date-picker__day--outside]="!d.inMonth"
        [class.date-picker__day--today]="d.today"
        [class.date-picker__day--selected]="d.iso === value()"
        [disabled]="d.disabled || disabled()"
        [attr.aria-pressed]="d.iso === value()"
        [attr.aria-label]="d.iso"
        (click)="pick(d)"
        (keydown)="onKey($event, i)"
      >
        {{ d.day }}
      </button>
    }
  </div>

  <p class="date-picker__selected">
    <app-icon name="calendar" [size]="16" />
    @if (selectedLabel()) {
      {{ selectedLabel() }}
    } @else {
      <span class="date-picker__placeholder">{{ 'booking.pickDate' | translate }}</span>
    }
  </p>
</div>
