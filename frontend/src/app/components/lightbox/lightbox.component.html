@if (current(); as item) {
  <div
    class="lightbox"
    role="dialog"
    aria-modal="true"
    animate.enter="lightbox--entering"
    animate.leave="lightbox--leaving"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <div class="lightbox__backdrop" (click)="close()" aria-hidden="true"></div>

    <div class="lightbox__bar">
      <span class="lightbox__counter">{{ (index() ?? 0) + 1 }} / {{ items().length }}</span>
      <div class="lightbox__tools">
        @if (allowDownload()) {
          <a
            class="lightbox__button"
            [href]="item.src"
            [attr.download]="item.downloadName || ''"
            target="_blank"
            rel="noopener"
            aria-label="Download"
          >
            <app-icon name="download" />
          </a>
        }
        <button type="button" class="lightbox__button" (click)="close()" aria-label="Close">
          <app-icon name="close" />
        </button>
      </div>
    </div>

    @for (it of [item]; track index()) {
      <figure class="lightbox__figure">
        <img [src]="it.src" [alt]="it.title || ''" class="lightbox__image" decoding="async" />
        @if (it.title) {
          <figcaption class="lightbox__caption">{{ it.title }}</figcaption>
        }
      </figure>
    }

    @if (items().length > 1) {
      <button
        type="button"
        class="lightbox__nav lightbox__nav--prev"
        (click)="step(-1)"
        aria-label="Previous"
      >
        <app-icon name="chevron-left" [size]="28" [stroke]="1" />
      </button>
      <button
        type="button"
        class="lightbox__nav lightbox__nav--next"
        (click)="step(1)"
        aria-label="Next"
      >
        <app-icon name="chevron-right" [size]="28" [stroke]="1" />
      </button>
    }
  </div>
}
