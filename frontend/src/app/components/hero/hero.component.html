<div class="hero">
  <div class="hero__glow" aria-hidden="true"></div>

  <div app-container class="hero__inner">
    <div class="hero__text">
      <p class="hero__welcome hero__appear" style="--d: 0ms">{{ 'hero.welcome' | translate }}</p>

      <h1 class="hero__title">
        <span class="hero__line"
          ><span class="hero__rise" style="--d: 120ms"
            >{{ 'hero.hello' | translate }} <span class="hero__name">{{ owner }}</span></span
          ></span
        >
      </h1>

      <!-- Typing line. Screen readers get all roles at once instead of the animation. -->
      <p class="hero__role hero__appear" style="--d: 320ms">
        <span aria-hidden="true">{{ typed() }}</span
        ><span class="hero__caret" aria-hidden="true"></span>
        <span class="sr-only">
          @for (key of roleKeys; track key) {
            {{ key | translate }}
          }
        </span>
      </p>

      <p app-text class="hero__description hero__appear" style="--d: 480ms">
        {{ 'hero.text' | translate }}
      </p>

      <div class="hero__actions hero__appear" style="--d: 640ms">
        <a app-button routerLink="/" fragment="booking">
          {{ 'hero.cta' | translate }}
          <app-icon name="arrow-right" [size]="16" />
        </a>
        <a app-link caps underline routerLink="/" fragment="works">
          {{ 'hero.works' | translate }}
        </a>
      </div>
    </div>

    <div class="hero__visual">
      <div class="hero__frame" aria-hidden="true"></div>
      <img
        [src]="portrait.src"
        [alt]="'hero.imageAlt' | translate"
        class="hero__portrait"
        [class.hero__portrait--photo]="!portrait.cutout"
        fetchpriority="high"
        decoding="async"
      />
    </div>
  </div>
</div>
