<section class="hero">
  <!-- Back layer: soft gold glow (no photo - plain black background) -->
  <div class="hero__glow" aria-hidden="true"></div>
  <div class="hero__sweep" aria-hidden="true"></div>

  <!-- Near layer: floating light specks (move more with the mouse) -->
  <div class="hero__near" aria-hidden="true">
    @for (s of specks; track $index) {
      <span
        class="hero__speck"
        [style.left.%]="s.left"
        [style.top.%]="s.top"
        [style.width.px]="s.size"
        [style.height.px]="s.size"
        [style.animation-duration.s]="s.duration"
        [style.animation-delay.s]="s.delay"
      ></span>
    }
  </div>

  <div class="hero__content">
    <div class="hero__inner">
      <div class="hero__text">
        <p app-eyebrow class="hero__appear" style="--d: 0ms">{{ 'hero.welcome' | translate }}</p>

        <h1 class="hero__title">
          <span class="hero__line"
            ><span class="hero__rise" style="--d: 120ms"
              >{{ 'hero.hello' | translate }} <span class="hero__name">{{ owner }}</span></span
            ></span
          >
        </h1>

        <!-- Typing line. Screen readers get all roles at once instead of the animation. -->
        <p class="hero__role hero__appear" style="--d: 320ms">
          <span aria-hidden="true">{{ typed() }}</span
          ><span class="hero__caret" aria-hidden="true"></span>
          <span class="sr-only">
            @for (key of roleKeys; track key) {
              {{ key | translate }}
            }
          </span>
        </p>

        <p app-text size="lead" class="hero__description hero__appear" style="--d: 480ms">
          {{ 'hero.text' | translate }}
        </p>

        <div class="hero__actions hero__appear" style="--d: 640ms">
          <a app-button routerLink="/booking">
            <app-icon name="calendar" [size]="16" />
            {{ 'hero.cta' | translate }}
          </a>
          <a app-link caps underline routerLink="/portfolio">
            {{ 'hero.works' | translate }}
            <app-icon name="arrow-right" [size]="14" />
          </a>
        </div>
      </div>

      <!-- Portrait stepping out of its frame (mouse depth + scroll parallax) -->
      <div class="hero__visual">
        <div class="hero__depth">
          <div class="hero__frame" aria-hidden="true"></div>
          <img
            [src]="portrait.src"
            [alt]="'hero.imageAlt' | translate"
            class="hero__portrait"
            [class.hero__portrait--photo]="!portrait.cutout"
            fetchpriority="high"
            decoding="async"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="hero__scroll hero__appear" style="--d: 900ms" aria-hidden="true">
    <span class="hero__scroll-line"></span>
  </div>
</section>
