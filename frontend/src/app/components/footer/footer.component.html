<footer class="footer">
  <div class="wrapper footer__cta">
    <p class="eyebrow" appReveal>Let's talk</p>
    <h2 class="title title--xl footer__title" appReveal [revealDelay]="100">
      Let's create something <em>timeless</em>.
    </h2>
    <div class="footer__contact" appReveal [revealDelay]="200">
      <a [href]="'mailto:' + brand.email" class="link link--underline footer__email">
        {{ brand.email }}
      </a>
      <a routerLink="/contact" class="btn btn--primary">
        Book a session
        <app-icon name="arrow-right" [size]="16" />
      </a>
    </div>
  </div>

  <div class="wrapper footer__bottom">
    <a routerLink="/" class="footer__brand">{{ brand.name }}</a>

    <nav class="footer__nav" aria-label="Footer">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" class="footer__link">{{ link.label }}</a>
      }
    </nav>

    <div class="footer__social">
      <a
        [href]="brand.instagram"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
        class="footer__icon"
      >
        <app-icon name="instagram" />
      </a>
      <a [href]="'mailto:' + brand.email" aria-label="Email" class="footer__icon">
        <app-icon name="mail" />
      </a>
      <span class="footer__copy">© {{ year }} {{ brand.name }}</span>
    </div>
  </div>
</footer>
