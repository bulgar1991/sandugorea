<header
  class="header"
  [class.header--solid]="scrolled() || menuOpen()"
  [class.header--hidden]="hidden() && !menuOpen()"
>
  <div app-container class="header__bar">
    <app-logo />

    <nav class="header__nav" [attr.aria-label]="'nav.main' | translate">
      @for (link of links; track link.path) {
        <a
          app-link
          underline
          [routerLink]="link.path"
          routerLinkActive="link--active header__link--active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="header__link"
        >
          {{ link.key | translate }}
        </a>
      }
    </nav>

    <div class="header__actions">
      <app-language-switcher class="header__lang" />
      <a app-button variant="outline" size="sm" routerLink="/client/login" class="header__client">
        <app-icon name="lock" [size]="14" />
        {{ 'nav.clientArea' | translate }}
      </a>
      <button
        type="button"
        class="header__burger"
        [class.header__burger--open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="'nav.menu' | translate"
      >
        <span class="header__burger-line"></span>
        <span class="header__burger-line"></span>
      </button>
    </div>
  </div>
</header>

@if (menuOpen()) {
  <div class="menu" animate.enter="menu--entering" animate.leave="menu--leaving">
    <nav app-container class="menu__nav" [attr.aria-label]="'nav.main' | translate">
      @for (link of links; track link.path; let i = $index) {
        <a
          [routerLink]="link.path"
          routerLinkActive="menu__link--active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="menu__link"
          [style.animation-delay.ms]="150 + i * 70"
          (click)="menuOpen.set(false)"
        >
          <span class="menu__index">0{{ i + 1 }}</span>
          {{ link.key | translate }}
        </a>
      }
      <a
        routerLink="/client/login"
        class="menu__link menu__link--active"
        [style.animation-delay.ms]="150 + links.length * 70"
      >
        <span class="menu__index">0{{ links.length + 1 }}</span>
        {{ 'nav.clientArea' | translate }}
      </a>
    </nav>
    <div app-container class="menu__footer">
      <app-language-switcher variant="inline" />
      <a app-link [href]="'mailto:' + brand.email">{{ brand.email }}</a>
    </div>
  </div>
}
