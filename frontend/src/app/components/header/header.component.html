<header
  class="header"
  [class.is-scrolled]="scrolled() || menuOpen()"
  [class.is-hidden]="hidden() && !menuOpen()"
>
  <div class="container-x flex h-20 items-center justify-between">
    <a routerLink="/" class="logo" aria-label="Home">
      <span class="logo__name">{{ brand.name }}</span>
      <span class="logo__tag">{{ brand.tagline }}</span>
    </a>

    <nav class="hidden items-center gap-10 lg:flex" aria-label="Main">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active !text-ink"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="link-underline text-[0.7rem] font-medium tracking-[0.3em] text-ink-muted uppercase hover:text-ink"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-4">
      <a routerLink="/client/login" class="btn btn-outline hidden !px-5 !py-2.5 sm:inline-flex">
        <app-icon name="lock" [size]="14" />
        Client area
      </a>
      <button
        type="button"
        class="burger lg:hidden"
        [class.is-open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Menu"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

@if (menuOpen()) {
  <div class="mobile-menu" animate.enter="menu-enter" animate.leave="menu-leave">
    <nav class="container-x flex flex-col gap-2" aria-label="Mobile">
      @for (link of links; track link.path; let i = $index) {
        <a
          [routerLink]="link.path"
          routerLinkActive="!text-accent"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="mobile-menu__link"
          [style.animation-delay.ms]="150 + i * 70"
        >
          <span class="text-xs text-ink-subtle">0{{ i + 1 }}</span>
          {{ link.label }}
        </a>
      }
      <a
        routerLink="/client/login"
        class="mobile-menu__link !text-accent"
        [style.animation-delay.ms]="150 + links.length * 70"
      >
        <span class="text-xs text-ink-subtle">0{{ links.length + 1 }}</span>
        Client area
      </a>
    </nav>
    <div class="container-x mt-auto flex flex-col gap-2 pb-10 text-sm text-ink-muted">
      <a [href]="'mailto:' + brand.email" class="hover:text-accent">{{ brand.email }}</a>
      <span>{{ brand.location }}</span>
    </div>
  </div>
}
