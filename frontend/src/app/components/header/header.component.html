<header
  class="header"
  [class.header--solid]="scrolled() || menuOpen()"
  [class.header--hidden]="hidden() && !menuOpen()"
>
  <div class="wrapper header__bar">
    <a routerLink="/" class="header__logo" aria-label="Home">
      <span class="header__name">{{ brand.name }}</span>
      <span class="header__tagline">{{ brand.tagline }}</span>
    </a>

    <nav class="header__nav" aria-label="Main">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="header__link--active link--active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="header__link link--underline"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="header__actions">
      <a routerLink="/client/login" class="btn btn--outline btn--sm header__client">
        <app-icon name="lock" [size]="14" />
        Client area
      </a>
      <button
        type="button"
        class="header__burger"
        [class.header__burger--open]="menuOpen()"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Menu"
      >
        <span class="header__burger-line"></span>
        <span class="header__burger-line"></span>
      </button>
    </div>
  </div>
</header>

@if (menuOpen()) {
  <div class="menu" animate.enter="menu--entering" animate.leave="menu--leaving">
    <nav class="wrapper menu__nav" aria-label="Mobile">
      @for (link of links; track link.path; let i = $index) {
        <a
          [routerLink]="link.path"
          routerLinkActive="menu__link--active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="menu__link"
          [style.animation-delay.ms]="150 + i * 70"
        >
          <span class="menu__index">0{{ i + 1 }}</span>
          {{ link.label }}
        </a>
      }
      <a
        routerLink="/client/login"
        class="menu__link menu__link--active"
        [style.animation-delay.ms]="150 + links.length * 70"
      >
        <span class="menu__index">0{{ links.length + 1 }}</span>
        Client area
      </a>
    </nav>
    <div class="wrapper menu__contact">
      <a [href]="'mailto:' + brand.email" class="link">{{ brand.email }}</a>
      <span>{{ brand.location }}</span>
    </div>
  </div>
}
