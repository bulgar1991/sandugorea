<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sandugorea — Photography</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Fine art, portrait and wedding photography." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
    />
  </head>
  <body>
    <app-root>
      <!-- Shown until Angular boots; <app-page-loader> then takes over with the same markup. -->
      <div class="page-loader" role="status">
        <div class="page-loader__brand" aria-hidden="true">
          <span class="page-loader__letter" style="animation-delay: 0ms">S</span
          ><span class="page-loader__letter" style="animation-delay: 45ms">A</span
          ><span class="page-loader__letter" style="animation-delay: 90ms">N</span
          ><span class="page-loader__letter" style="animation-delay: 135ms">D</span
          ><span class="page-loader__letter" style="animation-delay: 180ms">U</span
          ><span class="page-loader__letter" style="animation-delay: 225ms">G</span
          ><span class="page-loader__letter" style="animation-delay: 270ms">O</span
          ><span class="page-loader__letter" style="animation-delay: 315ms">R</span
          ><span class="page-loader__letter" style="animation-delay: 360ms">E</span
          ><span class="page-loader__letter" style="animation-delay: 405ms">A</span>
        </div>
        <span class="page-loader__bar" aria-hidden="true"></span>
        <span class="sr-only">Loading…</span>
      </div>
    </app-root>
  </body>
</html>
