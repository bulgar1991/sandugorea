# /etc/nginx/sites-available/sandugorea  (setup-server.sh installs it; certbot then adds HTTPS)

# www.sandugorea.ch -> sandugorea.ch
server {
    listen 80;
    server_name www.sandugorea.ch;
    return 301 https://sandugorea.ch$request_uri;
}

server {
    listen 80;
    server_name sandugorea.ch;

    server_tokens off;

    # Photo uploads: 200 MB per photo (the app enforces the exact limit).
    client_max_body_size 210m;
    client_body_timeout 300s;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $http_connection;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Stream uploads and big ZIP downloads instead of buffering them on disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
